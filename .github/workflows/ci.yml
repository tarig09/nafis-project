name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  app:
    if: ${{ hashFiles('app/pubspec.yaml') != '' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  supabase:
    if: ${{ hashFiles('supabase/migrations/*.sql') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: supabase db reset
      - run: supabase stop
