name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        working-directory: app
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org sd.nafis --project-name nafis .
          fi
          python3 tool/patch_android.py
          python3 tool/patch_gradle.py
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze --no-fatal-infos
      - working-directory: app
        run: flutter test
      - name: Build APK
        working-directory: app
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nafis-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: build-latest
          name: "Nafis — آخر بناء"
          body: "ملف APK لآخر commit على main (للتجربة فقط)"
          artifacts: app/build/app/outputs/flutter-apk/app-release.apk
          allowUpdates: true
          prerelease: true
          replacesArtifacts: true
          commit: ${{ github.sha }}

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: echo "has=$(ls supabase/migrations/*.sql >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.detect.outputs.has == 'true'
      - if: steps.detect.outputs.has == 'true'
        run: |
          supabase init --force || true
          supabase start
          supabase db reset
          supabase stop
